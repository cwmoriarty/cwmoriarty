<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="dsmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>
    <linearGradient id="blueTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="purpleTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c88ff"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="magentaTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>
    <linearGradient id="greenTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="amberTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <linearGradient id="synoBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0082fa"/>
      <stop offset="100%" stop-color="#0055b3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Synology App Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#dsmBg)" stroke="#313848" stroke-width="4" filter="url(#shadow)"/>

  <!-- Treemap Grid Visualizer Inner Window -->
  <g transform="translate(36, 42)">
    <!-- Top Left Large Block (Videos / Purple) -->
    <rect x="0" y="0" width="108" height="114" rx="6" fill="url(#purpleTile)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="4" y="4" width="100" height="106" rx="4" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Bottom Left Block (Archives / Green) -->
    <rect x="0" y="120" width="108" height="52" rx="6" fill="url(#greenTile)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Top Right Block (Executables / Syno Blue) -->
    <rect x="114" y="0" width="70" height="74" rx="6" fill="url(#blueTile)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Middle Right Block (Images / Red) -->
    <rect x="114" y="80" width="70" height="42" rx="6" fill="url(#magentaTile)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Bottom Right Block (Docs / Amber) -->
    <rect x="114" y="128" width="70" height="44" rx="6" fill="url(#amberTile)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Bottom Accent Synology Badge Bar -->
  <rect x="78" y="218" width="100" height="6" rx="3" fill="url(#synoBadge)" opacity="0.9"/>
</svg>
