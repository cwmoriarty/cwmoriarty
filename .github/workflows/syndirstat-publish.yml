name: SynDirStat Publish & Deploy Community Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  release-and-deploy:
    name: Build Release SPKs & Deploy GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: syndirstat/backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: syndirstat/frontend/package-lock.json

      - name: Build & Package Production SPKs
        run: |
          cd syndirstat/frontend
          npm ci
          cd ../..
          chmod +x syndirstat/scripts/*.sh
          chmod +x syndirstat/packaging/scripts/*
          chmod +x syndirstat/packaging/ui/index.cgi
          ./syndirstat/scripts/build.sh
          ./syndirstat/scripts/package.sh
          ./syndirstat/scripts/update-repo.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packages/syndirstat/syn-dirstat-x86_64-1.0.0.spk
            packages/syndirstat/syn-dirstat-arm64-1.0.0.spk
            packages/syndirstat/syn-dirstat-all-1.0.0.spk
            repository/packages.json
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
